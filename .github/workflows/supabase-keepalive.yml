name: Supabase keep-alive

# El plan Free de Supabase pausa el proyecto tras 7 días sin actividad.
# Este workflow hace una petición ligera cada 5 días para que nunca llegue
# a pausarse, sin coste y sin tener que "despertarlo" a mano desde el dashboard.

on:
  schedule:
    - cron: '0 6 */5 * *' # cada 5 días a las 06:00 UTC
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Comprobar que los secretos están configurados
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_URL (o está vacío). Revísalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Falta el secreto SUPABASE_ANON_KEY (o está vacío). Revísalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secretos presentes (longitud de SUPABASE_URL: ${#SUPABASE_URL} caracteres)."

      - name: Ping del endpoint de salud de Supabase Auth
        run: |
          curl -sf "${SUPABASE_URL}/auth/v1/health" -H "apikey: ${SUPABASE_ANON_KEY}"
